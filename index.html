const KEY='latihan-arab-darjah2-v1',NS='http://www.w3.org/2000/svg';
const QUESTIONS=new Map(),PICTURES=new Map();
PAGES.forEach(p=>{p.questions.forEach(q=>{q.page=p;QUESTIONS.set(q.id,q);});(p.pictures||[]).forEach(pic=>{pic.page=p;PICTURES.set(pic.id,pic);});});
const $=id=>document.getElementById(id),viewport=$('viewport');
const options=new Map(),blanks=new Map(),words=new Map(),pictures=new Map(),ticks=new Map();
function normalizeName(n){return typeof n==='string'?n.replace(/\s+/g,' ').trim().slice(0,120):'';}
function validAnswer(id,value){const q=QUESTIONS.get(id);return !!q && (q.kind==='match'?PICTURES.has(value):q.options.some(o=>o.value===value));}
function sanitize(raw){const a={},used=new Set();if(!raw||typeof raw!=='object'||Array.isArray(raw))return a;for(const [id,value] of Object.entries(raw)){if(!validAnswer(id,value))continue;if(QUESTIONS.get(id).kind==='match'){if(used.has(value))continue;used.add(value);}a[id]=value;}return a;}
function readState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null'),name=normalizeName(raw?.name);return {name,answers:sanitize(raw?.answers),page:Number.isInteger(raw?.page)&&raw.page>=0&&raw.page<3?raw.page:0,submitted:!!(raw?.submitted===true&&name)};}catch{return {name:'',answers:{},page:0,submitted:false};}}
const state=readState();
let selected=null,pointer=null,ghost=null,hover=null,raf=0,suppressClickUntil=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function announce(s){$('announce').textContent=s;}
function scores(a){let answered=0,correct=0,marks=0;QUESTIONS.forEach(q=>{if(validAnswer(q.id,a[q.id]))answered++;if(a[q.id]===q.answer){correct++;marks+=q.points;}});return {answered,correct,marks,total:20,maxMarks:30};}
function pictureOwner(imageId,a=state.answers){return [...QUESTIONS.values()].find(q=>q.kind==='match'&&a[q.id]===imageId)?.id;}
function placeAnswer(a,id,value){if(!validAnswer(id,value))return null;const next={...a},q=QUESTIONS.get(id);if(q.kind==='match'){const other=pictureOwner(value,a),displaced=next[id];if(other&&other!==id){delete next[other];if(displaced)next[other]=displaced;}}next[id]=value;return next;}
function answer(id,value){const next=placeAnswer(state.answers,id,value);if(!next)return false;state.answers=next;state.submitted=false;selected=null;render();announce(`Jawapan soalan ${id} dipilih.`);return true;}
function clearAnswer(id){if(!QUESTIONS.has(id))return;delete state.answers[id];state.submitted=false;selected=null;render();announce(`Jawapan soalan ${id} dikosongkan.`);}
function position(el,box,p){el.style.left=box[0]/p.width*100+'%';el.style.top=(box[1]-p.cropTop)/p.height*100+'%';el.style.width=box[2]/p.width*100+'%';el.style.height=box[3]/p.height*100+'%';}
function svgEl(name,attrs={}){const el=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;}
function imageEl(p){return svgEl('image',{href:p.image,width:p.width,height:p.fullHeight});}
function ink(p,crop){const el=svgEl('svg',{viewBox:crop.join(' '),preserveAspectRatio:'xMidYMid meet','aria-hidden':'true',focusable:'false'});el.classList.add('ink');el.append(imageEl(p));return el;}
const DIGITS={'(':[571,548,8,24],'0':[594,1162,7,24],'1':[592,548,8,24],'2':[592,621,11,24],'3':[591,685,14,24],'4':[592,754,11,24],'5':[590,824,11,24],'6':[591,893,12,24],'7':[590,958,13,24],'8':[590,1026,13,24],'9':[591,1093,11,24]};
function numberMask(q){const box=q.numberBox,scale=q.numberHeight/24,chars=['(',...q.id],gap=2*scale;const svg=svgEl('svg',{viewBox:`0 0 ${box[2]} ${box[3]}`,'aria-hidden':'true',focusable:'false'});svg.classList.add('number-mask');position(svg,box,q.page);svg.append(svgEl('rect',{width:box[2],height:box[3],fill:'white'}));const total=chars.reduce((s,c)=>s+DIGITS[c][2]*scale,0)+gap*(chars.length-1);let x=(box[2]-total)/2;for(const c of chars){const crop=DIGITS[c],g=svgEl('svg',{x,y:(box[3]-q.numberHeight)/2,width:crop[2]*scale,height:q.numberHeight,viewBox:crop.join(' ')});g.append(imageEl(PAGES[2]));svg.append(g);x+=crop[2]*scale+gap;}return svg;}
function button(cls,box,p,label){const b=document.createElement('button');b.type='button';b.className='hotspot '+cls;b.setAttribute('aria-label',label);position(b,box,p);return b;}
function build(){PAGES.forEach((p,index)=>{const sheet=document.createElement('section');sheet.id=p.id;sheet.className='sheet';sheet.hidden=index!==state.page;sheet.setAttribute('aria-label',`Halaman ${p.step}, soalan ${p.questions[0].id} hingga ${p.questions[p.questions.length-1].id}`);const scan=svgEl('svg',{viewBox:`0 ${p.cropTop} ${p.width} ${p.height}`,width:p.width,height:p.height,role:'img','aria-label':`Soalan Bahasa Arab Darjah 2, halaman ${p.step}.`});scan.classList.add('scan');scan.append(imageEl(p));sheet.append(scan);const overlay=document.createElement('div');overlay.className='overlay';
 p.questions.forEach(q=>overlay.append(numberMask(q)));
 if(p.kind==='match'){const lines=svgEl('svg',{viewBox:`0 0 ${p.width} ${p.height}`,'aria-hidden':'true',focusable:'false'});lines.id='match-lines';lines.classList.add('match-lines');overlay.append(lines);}
 p.questions.forEach(q=>{
  if(q.kind==='mcq'||q.kind==='tick'){
   const group=document.createElement('div');group.setAttribute('role','radiogroup');group.setAttribute('aria-label',`Soalan ${q.id}: ${q.prompt}`);
   q.options.forEach(o=>{const b=button(q.kind==='mcq'?'choice'+(q.blank?' can-drag':''):'tick-choice',o.box,p,`Soalan ${q.id}, ${o.value}: ${o.label}`);b.dataset.choice=q.id;b.dataset.value=o.value;b.setAttribute('role','radio');b.setAttribute('aria-checked','false');if(q.kind==='mcq'&&q.blank)b.dataset.drag='choice';group.append(b);options.set(q.id+':'+o.value,b);
    if(q.kind==='tick'){const check=svgEl('svg',{viewBox:'0 0 40 40','aria-hidden':'true',focusable:'false'});check.classList.add('tick-mark');position(check,o.tick,p);check.append(svgEl('path',{d:'M 7 21 L 16 29 L 33 11',fill:'none',stroke:'#111','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'}));check.setAttribute('hidden','');group.append(check);ticks.set(q.id+':'+o.value,check);}
   });overlay.append(group);
   if(q.blank){const b=button('drop blank',q.blank,p,`Ruang jawapan soalan ${q.id}`);b.dataset.blank=q.id;overlay.append(b);blanks.set(q.id,b);}
  }else{const b=button('word',q.wordBox,p,`Padankan soalan ${q.id}: ${q.prompt}`);b.dataset.word=q.id;b.dataset.drag='word';b.setAttribute('aria-pressed','false');overlay.append(b);words.set(q.id,b);}
 });
 (p.pictures||[]).forEach(pic=>{const b=button('picture',pic.box,p,`Gambar ${pic.label}`);b.dataset.picture=pic.id;b.dataset.drag='picture';b.setAttribute('aria-pressed','false');overlay.append(b);pictures.set(pic.id,b);});sheet.append(overlay);viewport.append(sheet);
});}
function line(a,b,cls){const p=PAGES[1],l=svgEl('line',{x1:a[0],y1:a[1]-p.cropTop,x2:b[0],y2:b[1]-p.cropTop});l.classList.add(cls);return l;}
function drawMatches(){const layer=$('match-lines');layer.replaceChildren();PAGES[1].questions.forEach(q=>{const value=state.answers[q.id];if(!value)return;const l=line(q.anchor,PICTURES.get(value).anchor,'match-line');if(state.submitted)l.classList.add(value===q.answer?'correct':'incorrect');layer.append(l);});if(pointer?.dragging&&(pointer.kind==='word'||pointer.kind==='picture')){const p=PAGES[1],r=$(p.id).getBoundingClientRect(),end=[(pointer.x-r.left)*p.width/r.width,(pointer.y-r.top)*p.height/r.height+p.cropTop],start=pointer.kind==='word'?QUESTIONS.get(pointer.idValue).anchor:PICTURES.get(pointer.idValue).anchor;layer.append(line(start,end,'draft-line'));}}
function render(){if($('student-name').value!==state.name)$('student-name').value=state.name;$('back').hidden=state.page===0;$('advance').textContent=state.page===2?'Submit':'Next';$('advance').setAttribute('aria-label',state.page===2?'Submit dan lihat markah keseluruhan':'Next: halaman seterusnya');PAGES.forEach((p,i)=>{$(p.id).hidden=i!==state.page;});
 options.forEach((b,key)=>{const [id,value]=key.split(':'),q=QUESTIONS.get(id),chosen=state.answers[id]===value;b.classList.toggle('is-picked',chosen);b.classList.toggle('correct',state.submitted&&chosen&&value===q.answer);b.classList.toggle('incorrect',state.submitted&&chosen&&value!==q.answer);b.setAttribute('aria-checked',chosen?'true':'false');if(ticks.has(key)){if(chosen)ticks.get(key).removeAttribute('hidden');else ticks.get(key).setAttribute('hidden','');}});
 blanks.forEach((b,id)=>{const value=state.answers[id],q=QUESTIONS.get(id);if(b.dataset.value!==(value||'')){b.replaceChildren();if(value)b.append(ink(q.page,q.options.find(o=>o.value===value).crop));b.dataset.value=value||'';}b.setAttribute('aria-label',`Soalan ${id}: ${value?'Jawapan '+q.options.find(o=>o.value===value).label:'Ruang jawapan kosong'}`);});
 words.forEach((b,id)=>{const value=state.answers[id],q=QUESTIONS.get(id),picked=selected?.kind==='word'&&selected.id===id;b.classList.toggle('is-picked',picked);b.classList.toggle('used',!!value);b.classList.toggle('ready',selected?.kind==='picture');b.classList.toggle('correct',!!(state.submitted&&value===q.answer));b.classList.toggle('incorrect',!!(state.submitted&&value&&value!==q.answer));b.classList.toggle('unanswered',state.submitted&&!value);b.setAttribute('aria-pressed',picked?'true':'false');b.setAttribute('aria-label',`Padankan soalan ${id}: ${q.prompt}${value?'. Dipadankan dengan '+PICTURES.get(value).label:''}`);});
 pictures.forEach((b,id)=>{const picked=selected?.kind==='picture'&&selected.id===id;b.classList.toggle('is-picked',picked);b.classList.toggle('used',!!pictureOwner(id));b.classList.toggle('ready',selected?.kind==='word');b.setAttribute('aria-pressed',picked?'true':'false');});drawMatches();
 $('pickbar').hidden=!selected;if(selected){const item=selected.kind==='word'?QUESTIONS.get(selected.id):PICTURES.get(selected.id);$('pick-preview').replaceChildren(ink(item.page,item.crop));$('remove').hidden=selected.kind==='word'?!state.answers[selected.id]:!pictureOwner(selected.id);}save();
}
function pickWord(id){if(selected?.kind==='picture'){answer(id,selected.id);return;}selected=selected?.kind==='word'&&selected.id===id?null:{kind:'word',id};render();announce(selected?'Tekan gambar yang sepadan.':'Pilihan dibatalkan.');}
function pickPicture(id){if(selected?.kind==='word'){answer(selected.id,id);return;}selected=selected?.kind==='picture'&&selected.id===id?null:{kind:'picture',id};render();announce(selected?'Tekan perkataan yang sepadan.':'Pilihan dibatalkan.');}
function changePage(index){if(!Number.isInteger(index)||index<0||index>=3)return;endDrag();selected=null;state.page=index;render();viewport.scrollLeft=0;window.scrollTo({top:0,behavior:'auto'});}
function requireName(){const name=normalizeName($('student-name').value);if(!name){$('name-error').textContent='Sila isi nama anda dahulu.';$('student-name').setAttribute('aria-invalid','true');$('student-name').focus();$('name-bar').scrollIntoView({block:'start',behavior:'auto'});return false;}state.name=name;$('student-name').value=name;$('name-error').textContent='';$('student-name').removeAttribute('aria-invalid');return true;}
function submitQuiz(){if(state.page!==2||!requireName())return false;endDrag();selected=null;state.submitted=true;render();const score=scores(state.answers);$('result-name').textContent=state.name;$('marks').textContent=String(score.marks);$('max-marks').textContent=String(score.maxMarks);$('result-detail').textContent=`${score.correct} daripada ${score.total} jawapan betul.`;$('result-unanswered').hidden=score.answered===score.total;$('result-unanswered').textContent=`Belum dijawab: ${score.total-score.answered}.`;const d=$('results');if(typeof d.showModal==='function'){if(!d.open)d.showModal();}else{d.classList.add('fallback');d.setAttribute('open','');}$('close-results').focus();return true;}
function closeResults(){const d=$('results');if(typeof d.close==='function')d.close();else d.removeAttribute('open');$('advance').focus();}
function compatibleTarget(el){if(!el||!pointer)return null;if(pointer.kind==='choice'){const b=el.closest('[data-blank]');return b?.dataset.blank===pointer.idValue?b:null;}if(pointer.kind==='word')return el.closest('[data-picture]');if(pointer.kind==='picture')return el.closest('[data-word]');return null;}
function updateHover(){if(hover)hover.classList.remove('over');hover=compatibleTarget(document.elementFromPoint(pointer.x,pointer.y));if(hover)hover.classList.add('over');}
function autoScroll(){if(!pointer?.dragging)return;const y=pointer.y,dy=y>innerHeight-65?Math.min(17,(y-innerHeight+65)*.3):y<55?-Math.min(17,(55-y)*.3):0;if(dy)window.scrollBy(0,dy);updateHover();drawMatches();raf=requestAnimationFrame(autoScroll);}
function startDrag(){pointer.dragging=true;if(pointer.kind==='word'||pointer.kind==='picture'){selected={kind:pointer.kind,id:pointer.idValue};render();}else{const q=QUESTIONS.get(pointer.idValue),o=q.options.find(o=>o.value===pointer.value);ghost=document.createElement('div');ghost.className='drag-ghost';ghost.style.width='130px';ghost.style.height='54px';ghost.append(ink(q.page,o.crop));document.body.append(ghost);}pointer.el.classList.add('dragging');$('pickbar').classList.add('drag-active');raf=requestAnimationFrame(autoScroll);}
function endDrag(){cancelAnimationFrame(raf);if(hover)hover.classList.remove('over');hover=null;if(ghost)ghost.remove();ghost=null;const old=pointer;pointer=null;if(old){old.el.classList.remove('dragging');try{if(old.el.hasPointerCapture(old.pointerId))old.el.releasePointerCapture(old.pointerId);}catch{}}$('pickbar').classList.remove('drag-active');if($('match-lines'))drawMatches();}
viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.isPrimary===false||pointer)return;const el=e.target.closest('[data-drag]');if(!el)return;const kind=el.dataset.drag;pointer={pointerId:e.pointerId,kind,idValue:el.dataset.choice||el.dataset.word||el.dataset.picture,value:el.dataset.value,el,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,dragging:false};try{el.setPointerCapture(e.pointerId);}catch{}});
document.addEventListener('pointermove',e=>{if(!pointer||pointer.pointerId!==e.pointerId)return;pointer.x=e.clientX;pointer.y=e.clientY;if(!pointer.dragging&&Math.hypot(pointer.x-pointer.startX,pointer.y-pointer.startY)>7)startDrag();if(pointer.dragging){e.preventDefault();if(ghost){ghost.style.left=pointer.x+'px';ghost.style.top=pointer.y+'px';}updateHover();drawMatches();}},{passive:false});
document.addEventListener('pointerup',e=>{if(!pointer||pointer.pointerId!==e.pointerId)return;if(pointer.dragging){suppressClickUntil=Date.now()+450;const target=compatibleTarget(document.elementFromPoint(e.clientX,e.clientY));if(target){if(pointer.kind==='choice')answer(pointer.idValue,pointer.value);else if(pointer.kind==='word')answer(pointer.idValue,target.dataset.picture);else answer(target.dataset.word,pointer.idValue);}else announce('Lepaskan pada pasangan atau ruang jawapan yang betul.');}endDrag();});
document.addEventListener('pointercancel',endDrag);window.addEventListener('blur',endDrag);viewport.addEventListener('lostpointercapture',()=>{if(pointer)endDrag();});viewport.addEventListener('dragstart',e=>e.preventDefault());
viewport.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();return;}const el=e.target.closest('.hotspot');if(!el)return;if(el.dataset.choice)answer(el.dataset.choice,el.dataset.value);else if(el.dataset.word)pickWord(el.dataset.word);else if(el.dataset.picture)pickPicture(el.dataset.picture);else if(el.dataset.blank)announce('Tekan satu pilihan jawapan pada baris soalan ini, atau seret jawapan ke ruang kosong.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){endDrag();selected=null;render();if($('results').classList.contains('fallback'))closeResults();}const el=e.target;if((e.key==='Delete'||e.key==='Backspace')&&el.classList?.contains('hotspot')){const id=el.dataset.choice||el.dataset.blank||el.dataset.word||pictureOwner(el.dataset.picture);if(id){e.preventDefault();clearAnswer(id);}}if(el.dataset?.choice&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const q=QUESTIONS.get(el.dataset.choice),i=q.options.findIndex(o=>o.value===el.dataset.value),direction=['ArrowRight','ArrowDown'].includes(e.key)?1:-1,o=q.options[(i+direction+q.options.length)%q.options.length];answer(q.id,o.value);options.get(q.id+':'+o.value).focus();}});
$('student-name').addEventListener('input',()=>{state.name=$('student-name').value.slice(0,120);state.submitted=false;$('name-error').textContent='';$('student-name').removeAttribute('aria-invalid');render();});
$('student-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('student-name').blur();}});
$('advance').addEventListener('click',()=>{if(!requireName())return;if(state.page<2)changePage(state.page+1);else submitQuiz();});
$('back').addEventListener('click',()=>{if(state.page>0)changePage(state.page-1);});
$('close-results').addEventListener('click',closeResults);$('cancel').addEventListener('click',()=>{selected=null;render();});
$('remove').addEventListener('click',()=>{if(!selected)return;const id=selected.kind==='word'?selected.id:pictureOwner(selected.id);if(id)clearAnswer(id);});
build();render();
</script></body></html>
